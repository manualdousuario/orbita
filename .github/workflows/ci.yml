name: 🧪 CI

on:
  push:
    branches: [main, feat/laravel-rewrite]
  pull_request:
  workflow_call: {}

jobs:
  test:
    name: 🧪 Pint + Pest
    runs-on: ubuntu-24.04

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 1
          MARIADB_DATABASE: orbita_laravel_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="valkey-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 📦 Cache node_modules
        id: node_cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: 📥 Install Node dependencies
        if: steps.node_cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: 🎨 Build frontend assets
        run: npm run build

      - name: 🐘 Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, gd, fileinfo, mbstring, intl, bcmath, exif, zip, redis
          coverage: none

      - name: 📦 Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: 📦 Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: 🔒 Composer audit
        run: composer audit

      - name: ⚙️ Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: 🎨 Code style (Pint)
        run: vendor/bin/pint --test

      - name: 🔬 Static analysis (PHPStan)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: 🧪 Run tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: orbita_laravel_test
          DB_USERNAME: root
          DB_PASSWORD: ''
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_PASSWORD: ''
        run: php artisan test
